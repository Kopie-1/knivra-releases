name: Publish Knivra Build 16
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-build-16.yml']
permissions:
  contents: write
concurrency:
  group: publish-build-16
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify public release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output Knivra-16.exe https://downloads.knivra.ca/releases/Knivra-16.exe
          echo 'ad3dabe68c0091e4e38c36b5d41502297e8327dbbe4186832078c775298100b9  Knivra-16.exe' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          curl --fail --location --retry 3 --output GODOT-LICENSE.txt https://downloads.knivra.ca/releases/GODOT-LICENSE.txt
          curl --fail --location --retry 3 --output GODOT-THIRD-PARTY.txt https://downloads.knivra.ca/releases/GODOT-THIRD-PARTY.txt
          echo 'b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80  GODOT-LICENSE.txt' | sha256sum --check -
          echo 'cb1980c88089573bcacd7221d777c689bb8bbd778799f24c27fca0fe5f774d6d  GODOT-THIRD-PARTY.txt' | sha256sum --check -
      - name: Publish verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Knivra — Build 16

          Download **Knivra-16.exe** for the latest fixes.

          - Melee AI closes to the reach of its actual weapon instead of repeatedly swinging just out of range.
          - AI picks up its chosen gun, avoiding rapid swaps between nearby dropped melee weapons.
          - Rifle, carbine and SMG AI mixes sustained bursts and deliberate taps with varied preferences.
          - Normal weapon rates, ammunition and reloads still apply.
          - A loaded rocket no longer shows a false low-ammo/reload warning.
          - Build 15 healer support, private low-health warning, kill feed and performance changes remain included.

          The Windows executable opens without a terminal. Website: https://knivra.ca

          SHA-256: `ad3dabe68c0091e4e38c36b5d41502297e8327dbbe4186832078c775298100b9`
          NOTES
          if gh release view build-16 >/dev/null 2>&1; then
            gh release upload build-16 Knivra-16.exe GODOT-LICENSE.txt GODOT-THIRD-PARTY.txt SHA256SUMS.txt --clobber
          else
            gh release create build-16 Knivra-16.exe GODOT-LICENSE.txt GODOT-THIRD-PARTY.txt SHA256SUMS.txt --target "$RELEASE_TARGET" --title "Knivra — Build 16: AI Combat Fixes" --notes-file notes.md --prerelease
          fi
