name: Publish Knivra Build 15
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-build-15.yml']
permissions:
  contents: write
concurrency:
  group: publish-build-15
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify public release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output Knivra-15.exe https://downloads.knivra.ca/releases/Knivra-15.exe
          echo '9f8006bc37a3fa13481170eb6229f540c5ad34eb4473d6432bd772d748034f24  Knivra-15.exe' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          curl --fail --location --retry 3 --output GODOT-LICENSE.txt https://downloads.knivra.ca/releases/GODOT-LICENSE.txt
          curl --fail --location --retry 3 --output GODOT-THIRD-PARTY.txt https://downloads.knivra.ca/releases/GODOT-THIRD-PARTY.txt
          echo 'b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80  GODOT-LICENSE.txt' | sha256sum --check -
          echo 'cb1980c88089573bcacd7221d777c689bb8bbd778799f24c27fca0fe5f774d6d  GODOT-THIRD-PARTY.txt' | sha256sum --check -
      - name: Publish verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Knivra — Build 15
          
          Download **Knivra-15.exe**. Both players need Build 15 for public matchmaking.
          
          - Nearby teammate healing is easier to target with right-click. Carry a kit and stand still while treatment completes.
          - Injured Healers automatically gain up to 75 HP from ground medkits. At full health, a pickup fills an empty carried-kit slot.
          - A private red warning ring pulses with your heartbeat below 45% health.
          - Kill messages name the attacker, victim and actual weapon, including projectiles after a weapon switch.
          - Batched grass drawing, cached shadows, faster replay compression, and no dedicated-server visual recording reduce CPU work without removing detail.
          - Snapshot fragments tolerate reordering. Build 14 spawn clearance remains included.
          
          The Windows executable opens without a terminal. The browser edition remains solo/AI.
          Website: https://knivra.ca
          SHA-256: `9f8006bc37a3fa13481170eb6229f540c5ad34eb4473d6432bd772d748034f24`
          NOTES
          if gh release view build-15 >/dev/null 2>&1; then
            gh release upload build-15 Knivra-15.exe GODOT-LICENSE.txt GODOT-THIRD-PARTY.txt SHA256SUMS.txt --clobber
          else
            gh release create build-15 Knivra-15.exe GODOT-LICENSE.txt GODOT-THIRD-PARTY.txt SHA256SUMS.txt --target "$RELEASE_TARGET" --title "Knivra — Build 15: Healer Support and Performance" --notes-file notes.md --prerelease
          fi
